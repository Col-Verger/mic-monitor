name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! The more precise the details, the faster this gets fixed.
        If the issue is about the "suspect" being wrong, check
        `%LOCALAPPDATA%\MicMonitor\mic-monitor.log` first — it shows what the app saw at that moment.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual behaviour
      placeholder: |
        Expected: changing the volume in Discord shows Discord.exe.
        Actual: the suspect is unknown.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Discord
        2. Go to Settings -> Voice
        3. Move the microphone slider
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: From `MicMonitor.exe --version`, the exe properties or the history window
      placeholder: "1.3.0"

  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: "Windows 11 23H2"

  - type: input
    id: device
    attributes:
      label: Recording device
      description: Its name from the overlay or from `--probe`
      placeholder: "Microphone (USB PnP Audio Device)"

  - type: dropdown
    id: language
    attributes:
      label: UI language
      options: [English, Русский]

  - type: textarea
    id: log
    attributes:
      label: Log snippet
      description: A few lines from `%LOCALAPPDATA%\MicMonitor\mic-monitor.log` around the problem
      render: text
